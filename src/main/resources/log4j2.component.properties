# Every logger is asynchronous: a log call only puts the event on an in-memory ring buffer (LMAX
# Disruptor), and a background thread formats and writes it. Event-loop and coroutine threads never
# wait on console or file I/O. Pending events are flushed when the application shuts down.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector

# If the buffer ever fills up (output can't keep up), drop INFO and below instead of making callers
# wait; WARN and ERROR are always kept.
log4j2.asyncQueueFullPolicy=Discard
log4j2.discardThreshold=INFO
